<svg xmlns="http://www.w3.org/2000/svg" class="s" width="842" height="246" viewBox="0 0 842 246" role="img" aria-label="Load test">
<style>
  .s { --bg: #ffffff; --ink: #191919; --ink2: #666666; --grid: #e4e4e4; --stock: #f47230; --plugin: #257de0; --ring: #ffffff; }
  @media (prefers-color-scheme: dark) {
    .s { --ink: #efefef; --ink2: #9c9c9c; --grid: #333333; --stock: #e76624; --plugin: #338ced; --ring: #0d1117; --bg: #0d1117; }
  }
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .t2 { fill: var(--ink2); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .link { stroke: var(--ink2); stroke-width: 2; opacity: .35; }
  .stock { fill: var(--stock); stroke: var(--ring); stroke-width: 2; }
  .plugin { fill: var(--plugin); stroke: var(--ring); stroke-width: 2; }
  .bstock { fill: var(--stock); }
  .bplugin { fill: var(--plugin); }
  .bg { fill: var(--bg); }
</style>
<rect class="bg" width="842" height="246" rx="6"/>
<g transform="translate(16 8)">
<circle class="stock" cx="6" cy="14" r="5"/><text x="16" y="18" font-size="12">WordPress alone</text><circle class="plugin" cx="136" cy="14" r="5"/><text x="146" y="18" font-size="12">With SpeedUp Meta Tables</text>
<text x="0" y="46" font-size="13" font-weight="600">Pages served in 45 s</text>
<text x="250" y="46" font-size="11" class="t2" text-anchor="end">more is better</text>
<line class="grid" x1="0" x2="250" y1="214" y2="214"/>
<path class="bstock" d="M30,214 V177.0 Q30,173.0 34,173.0 H96 Q100,173.0 100,177.0 V214 Z"><title>WordPress alone: 87 pages</title></path>
<text x="65.0" y="167.0" font-size="12" text-anchor="middle">87 pages</text>
<path class="bplugin" d="M150,214 V87.6 Q150,83.6 154,83.6 H216 Q220,83.6 220,87.6 V214 Z"><title>With the plugin: 277 pages</title></path>
<text x="185.0" y="77.6" font-size="12" text-anchor="middle">277 pages</text>
<text x="280" y="46" font-size="13" font-weight="600">Median page time</text>
<text x="530" y="46" font-size="11" class="t2" text-anchor="end">less is better</text>
<line class="grid" x1="280" x2="530" y1="214" y2="214"/>
<path class="bstock" d="M310,214 V87.6 Q310,83.6 314,83.6 H376 Q380,83.6 380,87.6 V214 Z"><title>WordPress alone: 1,243 ms</title></path>
<text x="345.0" y="77.6" font-size="12" text-anchor="middle">1,243 ms</text>
<path class="bplugin" d="M430,214 V161.1 Q430,157.1 434,157.1 H496 Q500,157.1 500,161.1 V214 Z"><title>With the plugin: 542 ms</title></path>
<text x="465.0" y="151.1" font-size="12" text-anchor="middle">542 ms</text>
<text x="560" y="46" font-size="13" font-weight="600">95th percentile page time</text>
<text x="810" y="46" font-size="11" class="t2" text-anchor="end">less is better</text>
<line class="grid" x1="560" x2="810" y1="214" y2="214"/>
<path class="bstock" d="M590,214 V87.6 Q590,83.6 594,83.6 H656 Q660,83.6 660,87.6 V214 Z"><title>WordPress alone: 6,735 ms</title></path>
<text x="625.0" y="77.6" font-size="12" text-anchor="middle">6,735 ms</text>
<path class="bplugin" d="M710,214 V190.2 Q710,186.2 714,186.2 H776 Q780,186.2 780,190.2 V214 Z"><title>With the plugin: 1,435 ms</title></path>
<text x="745.0" y="180.2" font-size="12" text-anchor="middle">1,435 ms</text>
</g></svg>
